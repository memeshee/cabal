<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="t d"><title id='t'>What the cabal does, and how the board shows it</title><desc id='d'>A caller pays for fresh wallets. Those wallets buy before the caller's call and sell into the copy-traders after it. A friend wallet paid for by an honest caller buys only after that caller's call, and a wallet paid for by the exchange is ruled out by its funder.</desc><rect width="1080" height="520" fill="#14110d"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#efe6d3"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#e5402a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4fd18b"/></marker></defs><text x="24" y="44" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-size="34" fill="#efe6d3" text-anchor="start" font-weight="800" letter-spacing="1.5">THE PATTERN</text><text x="24" y="68" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">Time runs left to right. A red string runs from whoever paid for a wallet to that wallet.</text><line x1="190.0" y1="96" x2="190.0" y2="452" stroke="#3a342a" stroke-width="1" stroke-dasharray="2 5"/><text x="190.0" y="470" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="middle" font-weight="400" letter-spacing="0">0s</text><line x1="331.66666666666663" y1="96" x2="331.66666666666663" y2="452" stroke="#3a342a" stroke-width="1" stroke-dasharray="2 5"/><text x="331.66666666666663" y="470" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="middle" font-weight="400" letter-spacing="0">30s</text><line x1="473.3333333333333" y1="96" x2="473.3333333333333" y2="452" stroke="#3a342a" stroke-width="1" stroke-dasharray="2 5"/><text x="473.3333333333333" y="470" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="middle" font-weight="400" letter-spacing="0">60s</text><line x1="615.0" y1="96" x2="615.0" y2="452" stroke="#3a342a" stroke-width="1" stroke-dasharray="2 5"/><text x="615.0" y="470" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="middle" font-weight="400" letter-spacing="0">90s</text><line x1="756.6666666666666" y1="96" x2="756.6666666666666" y2="452" stroke="#3a342a" stroke-width="1" stroke-dasharray="2 5"/><text x="756.6666666666666" y="470" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="middle" font-weight="400" letter-spacing="0">120s</text><line x1="898.3333333333334" y1="96" x2="898.3333333333334" y2="452" stroke="#3a342a" stroke-width="1" stroke-dasharray="2 5"/><text x="898.3333333333334" y="470" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="middle" font-weight="400" letter-spacing="0">150s</text><line x1="1040.0" y1="96" x2="1040.0" y2="452" stroke="#3a342a" stroke-width="1" stroke-dasharray="2 5"/><text x="1040.0" y="470" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="middle" font-weight="400" letter-spacing="0">180s</text><rect x="24" y="106" width="6" height="28" fill="#58b6c9"/><text x="40" y="126" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-size="20" fill="#efe6d3" text-anchor="start" font-weight="700" letter-spacing="0.8">@mira</text><line x1="190" y1="120" x2="1040" y2="120" stroke="#58b6c9" stroke-width="1"/><rect x="24" y="162" width="6" height="28" fill="#b6a1ff"/><text x="40" y="182" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-size="20" fill="#efe6d3" text-anchor="start" font-weight="700" letter-spacing="0.8">@oren</text><line x1="190" y1="176" x2="1040" y2="176" stroke="#b6a1ff" stroke-width="1"/><rect x="24" y="218" width="6" height="28" fill="#7d7566"/><text x="40" y="238" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-size="20" fill="#efe6d3" text-anchor="start" font-weight="700" letter-spacing="0.8">exchange</text><line x1="190" y1="232" x2="1040" y2="232" stroke="#7d7566" stroke-width="1"/><path d="M 496.94444444444446 123 l -8 -20 h 16 z" fill="#58b6c9"/><circle cx="496.94444444444446" cy="96" r="6" fill="#58b6c9" stroke="#14110d" stroke-width="2"/><text x="496.94444444444446" y="86" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#58b6c9" text-anchor="middle" font-weight="600" letter-spacing="0">@mira calls</text><path d="M 747.2222222222222 179 l -8 -20 h 16 z" fill="#b6a1ff"/><circle cx="747.2222222222222" cy="152" r="6" fill="#b6a1ff" stroke="#14110d" stroke-width="2"/><text x="747.2222222222222" y="142" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#b6a1ff" text-anchor="middle" font-weight="600" letter-spacing="0">@oren calls</text><line x1="496.94444444444446" y1="124" x2="496.94444444444446" y2="452" stroke="#58b6c9" stroke-width="1" stroke-dasharray="1 4"/><line x1="747.2222222222222" y1="180" x2="747.2222222222222" y2="452" stroke="#b6a1ff" stroke-width="1" stroke-dasharray="1 4"/><path d="M 350.55555555555554 120 C 376.55555555555554 171.0, 324.55555555555554 239.0, 350.55555555555554 290" fill="none" stroke="#e5402a" stroke-width="1.6"/><circle cx="350.55555555555554" cy="290" r="6" fill="#14110d" stroke="#e5402a" stroke-width="1.6"/><line x1="350.55555555555554" y1="290" x2="530.0" y2="290" stroke="#e5402a" stroke-width="1"/><rect x="416.3888888888889" y="285" width="10" height="10" fill="#4fd18b"/><rect x="525.0" y="285" width="10" height="10" fill="#ef6a52" transform="rotate(45 530.0 290)"/><text x="40" y="294" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">fresh wallet #1</text><path d="M 360.0 120 C 386.0 179.4, 334.0 258.6, 360.0 318" fill="none" stroke="#e5402a" stroke-width="1.6"/><circle cx="360.0" cy="318" r="6" fill="#14110d" stroke="#e5402a" stroke-width="1.6"/><line x1="360.0" y1="318" x2="544.1666666666667" y2="318" stroke="#e5402a" stroke-width="1"/><rect x="430.55555555555554" y="313" width="10" height="10" fill="#4fd18b"/><rect x="539.1666666666667" y="313" width="10" height="10" fill="#ef6a52" transform="rotate(45 544.1666666666667 318)"/><text x="40" y="322" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">fresh wallet #2</text><path d="M 374.16666666666663 120 C 400.16666666666663 187.8, 348.16666666666663 278.2, 374.16666666666663 346" fill="none" stroke="#e5402a" stroke-width="1.6"/><circle cx="374.16666666666663" cy="346" r="6" fill="#14110d" stroke="#e5402a" stroke-width="1.6"/><line x1="374.16666666666663" y1="346" x2="558.3333333333333" y2="346" stroke="#e5402a" stroke-width="1"/><rect x="435.27777777777777" y="341" width="10" height="10" fill="#4fd18b"/><rect x="553.3333333333333" y="341" width="10" height="10" fill="#ef6a52" transform="rotate(45 558.3333333333333 346)"/><text x="40" y="350" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">fresh wallet #3</text><path d="M 652.7777777777778 176 C 678.7777777777778 239.0, 626.7777777777778 323.0, 652.7777777777778 386" fill="none" stroke="#b6a1ff" stroke-width="1.6"/><circle cx="652.7777777777778" cy="386" r="6" fill="#14110d" stroke="#b6a1ff" stroke-width="1.6"/><line x1="652.7777777777778" y1="386" x2="803.8888888888889" y2="386" stroke="#b6a1ff" stroke-width="1"/><rect x="798.8888888888889" y="381" width="10" height="10" fill="#4fd18b"/><text x="40" y="390" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">friend of @oren</text><path d="M 213.61111111111111 232 C 239.61111111111111 288.4, 187.61111111111111 363.6, 213.61111111111111 420" fill="none" stroke="#58b6c9" stroke-width="1.6" stroke-dasharray="4 4"/><circle cx="213.61111111111111" cy="420" r="6" fill="#14110d" stroke="#58b6c9" stroke-width="1.6"/><line x1="213.61111111111111" y1="420" x2="879.4444444444445" y2="420" stroke="#58b6c9" stroke-width="1"/><rect x="246.38888888888889" y="415" width="10" height="10" fill="#4fd18b"/><rect x="874.4444444444445" y="415" width="10" height="10" fill="#ef6a52" transform="rotate(45 879.4444444444445 420)"/><text x="40" y="424" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">exchange whale</text><rect x="344.55555555555554" y="278" width="129.33333333333337" height="82" fill="none" stroke="#e5402a" stroke-width="1.2" stroke-dasharray="3 3"/><text x="350.55555555555554" y="272" font-family="'Special Elite', 'Courier New', monospace" font-size="12.5" fill="#e5402a" text-anchor="start" font-weight="400" letter-spacing="0">① @mira pays for 3 wallets</text><text x="345.83333333333337" y="376" font-family="'Special Elite', 'Courier New', monospace" font-size="12.5" fill="#e5402a" text-anchor="start" font-weight="400" letter-spacing="0">② they buy first…</text><text x="511.1111111111111" y="376" font-family="'Special Elite', 'Courier New', monospace" font-size="12.5" fill="#e5402a" text-anchor="start" font-weight="400" letter-spacing="0">③ …then sell into the crowd after her call</text><text x="681.1111111111111" y="408" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#b6a1ff" text-anchor="start" font-weight="400" letter-spacing="0">buys only after @oren's own call: ruled out</text><text x="284.44444444444446" y="444" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#58b6c9" text-anchor="start" font-weight="400" letter-spacing="0">funded by the exchange, not a caller: ruled out</text><rect x="24" y="486" width="9" height="9" fill="#4fd18b"/><text x="40" y="495" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">bought</text><rect x="104" y="486" width="9" height="9" fill="#ef6a52" transform="rotate(45 108 490)"/><text x="122" y="495" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">sold</text><line x1="180" y1="490" x2="204" y2="490" stroke="#e5402a" stroke-width="1.6"/><text x="212" y="495" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">paid for by a caller</text><line x1="360" y1="490" x2="384" y2="490" stroke="#58b6c9" stroke-width="1.6" stroke-dasharray="4 4"/><text x="392" y="495" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">paid for by the exchange</text></svg>