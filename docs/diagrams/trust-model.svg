<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-labelledby="t d"><title id='t'>How CABAL keeps the house honest</title><desc id='d'>Before play the contract stores a hash of the secret roles. After play the house must reveal them; the contract rejects a reveal that does not match the hash, or whose side wallets the cabal never funded. A silent house loses its bond.</desc><rect width="1080" height="580" fill="#14110d"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#efe6d3"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#e5402a"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#4fd18b"/></marker></defs><text x="24" y="44" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-size="34" fill="#efe6d3" text-anchor="start" font-weight="800" letter-spacing="1.5">THE HOUSE CAN'T CHEAT</text><text x="24" y="68" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">Who the cabal is gets locked in before anyone trades. These are the only moves the house has.</text><rect x="24" y="96" width="312" height="372" fill="#1b1812" stroke="#3a342a" stroke-width="1"/><rect x="24" y="96" width="312" height="30" fill="#25211a"/><text x="38" y="116" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#f2c230" text-anchor="start" font-weight="600" letter-spacing="1.4">1 · BEFORE PLAY</text><text x="38" y="146" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-size="15" fill="#efe6d3" text-anchor="start" font-weight="700" letter-spacing="0.6">the house commits</text><rect x="384" y="96" width="312" height="372" fill="#1b1812" stroke="#3a342a" stroke-width="1"/><rect x="384" y="96" width="312" height="30" fill="#25211a"/><text x="398" y="116" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#f2c230" text-anchor="start" font-weight="600" letter-spacing="1.4">2 · DURING PLAY</text><text x="398" y="146" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-size="15" fill="#efe6d3" text-anchor="start" font-weight="700" letter-spacing="0.6">the house can't change the answer</text><rect x="744" y="96" width="312" height="372" fill="#1b1812" stroke="#3a342a" stroke-width="1"/><rect x="744" y="96" width="312" height="30" fill="#25211a"/><text x="758" y="116" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#f2c230" text-anchor="start" font-weight="600" letter-spacing="1.4">3 · AFTER PLAY</text><text x="758" y="146" font-family="'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif" font-size="15" fill="#efe6d3" text-anchor="start" font-weight="700" letter-spacing="0.6">the house must reveal</text><line x1="340" y1="282" x2="380" y2="282" stroke="#b9af9b" stroke-width="1.5" marker-end="url(#a)"/><line x1="700" y1="282" x2="740" y2="282" stroke="#b9af9b" stroke-width="1.5" marker-end="url(#a)"/><text x="38" y="178" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">The house picks the cabal and its side</text><text x="38" y="196" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">wallets, plus a random salt:</text><rect x="38" y="208" width="284" height="64" fill="#14110d" stroke="#3a342a" stroke-width="1"/><text x="48" y="232" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">cabal = @mira</text><text x="48" y="250" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">sides = 3 fresh wallets</text><text x="48" y="266" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#7d7566" text-anchor="start" font-weight="400" letter-spacing="0">salt  = 9f2c…</text><line x1="180" y1="274" x2="180" y2="304" stroke="#f2c230" stroke-width="1.5" marker-end="url(#a)"/><text x="190" y="294" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#f2c230" text-anchor="start" font-weight="400" letter-spacing="0">sha256</text><rect x="38" y="306" width="284" height="44" fill="#14110d" stroke="#f2c230" stroke-width="1.5"/><text x="48" y="324" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="start" font-weight="400" letter-spacing="0">commitment</text><text x="48" y="342" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#f2c230" text-anchor="start" font-weight="600" letter-spacing="0">40388cb184049d82…</text><line x1="180" y1="352" x2="180" y2="380" stroke="#f2c230" stroke-width="1.5" marker-end="url(#a)"/><rect x="38" y="382" width="284" height="70" fill="#1f1a10" stroke="#f2c230" stroke-width="1.5"/><text x="48" y="402" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#f2c230" text-anchor="start" font-weight="600" letter-spacing="0.6">CONTRACT STORES THE HASH</text><text x="48" y="420" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">on-chain, in open_round().</text><text x="48" y="437" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">The secret itself stays with the house.</text><text x="398" y="178" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">Everything players see is a real</text><text x="398" y="196" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">transaction on the contract:</text><rect x="398" y="212" width="284" height="24" fill="#14110d" stroke="#3a342a" stroke-width="1"/><text x="408" y="228" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#f2c230" text-anchor="start" font-weight="700" letter-spacing="0.6">CALL</text><text x="480" y="228" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">a caller posts</text><rect x="398" y="242" width="284" height="24" fill="#14110d" stroke="#3a342a" stroke-width="1"/><text x="408" y="258" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#58b6c9" text-anchor="start" font-weight="700" letter-spacing="0.6">FUND</text><text x="480" y="258" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">someone pays for a wallet</text><rect x="398" y="272" width="284" height="24" fill="#14110d" stroke="#3a342a" stroke-width="1"/><text x="408" y="288" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#4fd18b" text-anchor="start" font-weight="700" letter-spacing="0.6">BUY</text><text x="480" y="288" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">a wallet buys chips</text><rect x="398" y="302" width="284" height="24" fill="#14110d" stroke="#3a342a" stroke-width="1"/><text x="408" y="318" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#ef6a52" text-anchor="start" font-weight="700" letter-spacing="0.6">SELL</text><text x="480" y="318" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">a wallet sells chips</text><rect x="398" y="332" width="284" height="24" fill="#14110d" stroke="#3a342a" stroke-width="1"/><text x="408" y="348" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#e5402a" text-anchor="start" font-weight="700" letter-spacing="0.6">EXPOSE</text><text x="480" y="348" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">you stake on a name</text><rect x="398" y="372" width="284" height="80" fill="#14110d" stroke="#e5402a" stroke-width="1.5"/><text x="408" y="392" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#e5402a" text-anchor="start" font-weight="600" letter-spacing="0.6">WHAT THE HOUSE CANNOT DO</text><text x="408" y="412" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">× change who the cabal is</text><text x="408" y="430" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">× edit the tape or the funding links</text><text x="408" y="446" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">× pick a new cabal after seeing who you accuse</text><text x="758" y="178" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">The house calls reveal(), sending</text><text x="758" y="196" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">the secret. The contract checks:</text><rect x="758" y="212" width="284" height="44" fill="#14110d" stroke="#4fd18b" stroke-width="1.2"/><text x="768" y="231" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">✓ sha256(secret) == commitment</text><text x="782" y="248" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="start" font-weight="400" letter-spacing="0">else rejected</text><rect x="758" y="264" width="284" height="44" fill="#14110d" stroke="#4fd18b" stroke-width="1.2"/><text x="768" y="283" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">✓ each side wallet was funded by the cabal</text><text x="782" y="300" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="start" font-weight="400" letter-spacing="0">else rejected</text><rect x="758" y="316" width="284" height="44" fill="#14110d" stroke="#4fd18b" stroke-width="1.2"/><text x="768" y="335" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">✓ sent before the reveal deadline</text><text x="782" y="352" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#7d7566" text-anchor="start" font-weight="400" letter-spacing="0">else anyone can void</text><rect x="758" y="372" width="284" height="80" fill="#12201a" stroke="#4fd18b" stroke-width="1.5"/><text x="768" y="392" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#4fd18b" text-anchor="start" font-weight="600" letter-spacing="0.6">THEN THE CONTRACT PAYS OUT</text><text x="768" y="412" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">right accusers: stake + share of pot</text><text x="768" y="430" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">the cabal's remaining bag is burned</text><text x="768" y="446" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#efe6d3" text-anchor="start" font-weight="400" letter-spacing="0">silent house: bond goes to accusers</text><rect x="24" y="484" width="1032" height="68" fill="#1b1812" stroke="#3a342a" stroke-width="1"/><text x="40" y="504" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11.5" fill="#f2c230" text-anchor="start" font-weight="600" letter-spacing="0.6">AND YOUR BROWSER CHECKS IT AGAIN</text><text x="40" y="522" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">On the reveal screen your browser hashes the revealed secret itself (Web Crypto) and compares it to the stored commitment,</text><text x="40" y="538" font-family="'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#b9af9b" text-anchor="start" font-weight="400" letter-spacing="0">instead of trusting a flag from the house.</text></svg>