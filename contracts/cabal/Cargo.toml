[package]
name = "cabal"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "CABAL game contract: a bonding-curve memecoin market, an on-chain evidence log, and a committed hidden role the house must reveal honestly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
